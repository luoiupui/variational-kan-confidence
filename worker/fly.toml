# Fly config for the Stage 4 worker. No HTTP service — this is a pure
# background poller that talks to Postgres + the ingest-run edge function.
# Killing the [http_service] block is what silences the "not listening on
# 0.0.0.0:8080" warning you saw after `flyctl secrets set`.
#
# IMPORTANT — this app runs TWO process groups:
#   * worker  → background poller (no HTTP, mounts /data volume)
#   * agent   → FastAPI microAgent on port 8080 (called by Lovable edge fn)
# Each process group needs its OWN machine. After deploy, run:
#     flyctl scale count worker=1 agent=1 -a worker-misty-butterfly-4770
# Otherwise Fly only schedules one machine and the other process never runs,
# which is why /agent/status looks dead even though the deploy succeeded.

app = "worker-misty-butterfly-4770"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[processes]
  worker = "python -u worker/stage4/poller.py"
  agent  = "python -u -m uvicorn worker.agent.serve:app --host 0.0.0.0 --port 8080"

# Restart the machine if the poller exits for any reason. Without this
# block Fly leaves a crashed machine in `stopped` state forever.
[[restart]]
  policy = "always"
  max_retries = 10

[[mounts]]
  source      = "tum_data"
  destination = "/data"
  processes   = ["worker"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["agent"]

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "1gb"
  processes = ["worker"]

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "1gb"
  processes = ["agent"]